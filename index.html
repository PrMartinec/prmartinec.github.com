<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petr Martinec - Vývojář aplikací</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 60px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .bio {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
            text-align: justify;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        .button-container {
            margin-bottom: 30px;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }

        .footer {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }

        .app-icon {
            margin-right: 8px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 50px;
            }

            .bio {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">👨‍💻</div>
        
        <h1>Petr Martinec</h1>
        <p class="subtitle">Vývojář mobilních aplikací</p>
        
        <p class="bio">
            Vítej na mém webu! Jsem vývojář zaměřený na tvorbu mobilních aplikací. 
            V současné době mám svou první aplikaci dostupnou na Google Play. 
            Neustále se učím a rozvíjím své dovednosti v oblasti mobilního vývoje.
        </p>

        <div class="button-container">
            <a href="https://play.google.com/store/apps/details?id=com.martinec.uhadni_mesto" 
               class="cta-button" 
               target="_blank" 
               rel="noopener noreferrer">
                <span class="app-icon">📱</span>Zobrazit aplikaci
            </a>
        </div>

        <div class="divider"></div>
    </div>
</body>
</html>
